# Pinned contract snapshot — SoT lives in mashgate/contracts/.
# This file declares which snapshot version this SDK release targets.
#
# Update workflow:
#   1. Core monorepo tags a contracts snapshot (e.g. `contracts-2026-04-24`).
#   2. Run `./contracts-sync/scripts/sync.sh` which downloads + regenerates.
#   3. CI verifies generated artefacts didn't drift from the tag.

version: 1

snapshot:
  tag: contracts-2026-04-24    # last cut tag; regenerated from origin/main HEAD ahead of it
  head_ref: 8a8fbb025875fcb13068bc93650f20eac42f67f4
  source: github.com/saidmashhud/mashgate
  source_path: contracts
  fetched_at: 2026-07-18       # TS + Go regenerated on srv2 (protoc+protoc-gen-openapi -> openapi -> openapi-typescript / oapi-codegen)

sdk_versions:           # mirrors the real published versions (package.json / pyproject / git tags)
  go: "1.18.0"
  typescript: "1.8.0"
  python: "0.8.0"
  # 2026-06-01 contracts-sync regen refreshed _generated types only; it sits in CHANGELOG [Unreleased]
  # until the next normal per-language release (no bump applied here).

platform_compatibility:
  min: "mashgate@v2.0.0"   # Wave 2 control-plane release
  max: ""                    # no upper bound yet
